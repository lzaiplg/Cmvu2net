seed: 42
mask_type: 'triple'

train_dataset:
  type: Dataset
  dataset_root: ./data/deepcrack
  train_path: ./data/deepcrack/train.txt
  num_classes: 2
  mode: train
  transforms:
    - type: ResizeStepScaling
      min_scale_factor: 0.5
      max_scale_factor: 2.0
      scale_step_size: 0.25
    - type: RandomPaddingCrop
      crop_size: [256, 256]
    - type: RandomHorizontalFlip
    - type: RandomDistort
      brightness_range: 0.5
      contrast_range: 0.5
      saturation_range: 0.5
      hue_range: 0.5
    - type: FourValueLabelConvert
      ce_weights: [1.3, 0.8, 1.0]
      ignore_index: 255
    - type: Normalize

val_dataset:
  type: Dataset
  dataset_root: ./data/deepcrack
  val_path: ./data/deepcrack/val.txt
  num_classes: 2
  mode: val
  transforms:
    - type: FourValueLabelConvert
      ce_weights: [1.3, 0.8, 1.0]
      ignore_index: 255
    - type: Normalize

model:
  type: cmvu2net
  num_classes: 2
  in_channels: 3

batch_size: 16

optimizer:
  type: adam

loss:
  types:
    - type: CrossEntropyLoss
      ignore_index: 255
      weight: [1.0, 1.0]
    - type: TverskyLoss
      ignore_index: 255
      alpha: 0.3
      beta: 0.7
      channel_index: 0
  coef: [1.0, 1.0]

lr_scheduler:
  type: PolynomialDecay
  learning_rate: 0.001
  end_lr: 0.0
  power: 0.0
  warmup_iters: 0
  warmup_start_lr: 1.0e-5
